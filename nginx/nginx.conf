upstream frontend_service {
    server frontend:80;
}

upstream auth_service {
    server auth:4001;
}

upstream listings_service {
    server listings:4002;
}

upstream bookings_service {
    server bookings:4003;
}

upstream payments_service {
    server payments:4004;
}

upstream messaging_service {
    server messaging:4005;
}

upstream notifications_service {
    server notifications:4006;
}

server {
    listen 4000;
    server_name _;

    location = /health {
        default_type application/json;
        return 200 '{"service":"nginx","status":"ok"}';
    }

    location /api/auth {
        proxy_pass http://auth_service;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/listings {
        proxy_pass http://listings_service;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/bookings {
        proxy_pass http://bookings_service;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/payments {
        proxy_pass http://payments_service;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/messaging {
        proxy_pass http://messaging_service;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/notifications {
        proxy_pass http://notifications_service;
        include /etc/nginx/proxy_headers.conf;
    }

    location / {
        proxy_pass http://frontend_service;
        include /etc/nginx/proxy_headers.conf;
    }
}


