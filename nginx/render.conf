
server {
    listen 10000;
    server_name _;

    proxy_ssl_server_name on;

    location = /health {
        default_type application/json;
        return 200 '{"service":"staybnb-gateway","status":"ok"}';
    }

    location /api/auth {
        proxy_pass https://staybnb-cdiz.onrender.com;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/listings {
        proxy_pass https://staybnb-listings.onrender.com;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/bookings {
        proxy_pass https://staybnb-bookings.onrender.com;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/payments {
        proxy_pass https://staybnb-payments.onrender.com;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/messaging {
        proxy_pass https://staybnb-messaging.onrender.com;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/notifications {
        proxy_pass https://staybnb-notifications.onrender.com;
        include /etc/nginx/proxy_headers.conf;
    }
}
